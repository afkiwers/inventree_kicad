name: Style Checks

on: ["push", "pull_request"]

jobs:
  style:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Deps
        run: |
          pip install -U ruff
      - name: Style Checks
        run: |
          ruff check
